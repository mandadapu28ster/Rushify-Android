name: Release APK

# Publish a GitHub release (tag like v0.2.0) and this builds a signed APK and attaches it to that release.
on:
  release:
    types: [published]
  workflow_dispatch:   # manual test run: builds a signed APK and keeps it as a workflow artifact

permissions:
  contents: write      # needed to upload the APK to the release

concurrency:
  group: release-apk-${{ github.event.release.tag_name || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      KEYSTORE_BASE64: ${{ secrets.RUSHIFY_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.RUSHIFY_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.RUSHIFY_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.RUSHIFY_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        id: version
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            TAG="$RELEASE_TAG"; NAME="${TAG#v}"
          else
            TAG="manual-${GITHUB_RUN_NUMBER}"; NAME="0.0.0-manual.${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Building $NAME (versionCode $GITHUB_RUN_NUMBER)"

      - name: Check signing secrets
        run: |
          missing=""
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets for:$missing. Run scripts/set-github-secrets.sh once (see README, Releases)."
            exit 1
          fi

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Build signed release APK
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/rushify-release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/rushify-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          ./gradlew :app:assembleRelease --console=plain \
            -PappVersionName="${{ steps.version.outputs.name }}" \
            -PappVersionCode="${{ steps.version.outputs.code }}"
          rm -f keystore.properties "$RUNNER_TEMP/rushify-release.jks"

      - name: Verify and name the APK
        id: apk
        run: |
          mkdir -p dist
          OUT="dist/Rushify-${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$OUT"
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$OUT" | head -3
          (cd dist && sha256sum "$(basename "$OUT")" > "$(basename "$OUT").sha256")
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          ls -l dist

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.version.outputs.tag }}" dist/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Keep as a workflow artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Rushify-apk
          path: dist/*
          retention-days: 14
